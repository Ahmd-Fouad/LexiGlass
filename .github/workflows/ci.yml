name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexiglass_test
          POSTGRES_PASSWORD: lexiglass_test
          POSTGRES_DB: lexiglass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexiglass_test -d lexiglass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lexiglass_test:lexiglass_test@127.0.0.1:5432/lexiglass_test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      RUN_DB_INTEGRATION: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency audit (high and critical findings fail CI)
        run: npm audit --audit-level=high
